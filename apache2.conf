ServerName honestups.com

LoadModule dir_module modules/mod_dir.so
DirectoryIndex index.html
CustomLog /usr/local/apache2/logs/access.log combined
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule alias_module modules/mod_alias.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %B" combined
LoadModule authn_core_module modules/mod_authn_core.so
Define APACHE_PID_FILE /var/run/apache2/apache2.pid
Define APACHE_RUN_USER www-data
Define APACHE_RUN_GROUP www-data
Define APACHE_LOG_DIR /var/log/apache2

ServerRoot "/usr/local/apache2/htdocs/"

PidFile ${APACHE_PID_FILE}

Timeout 1000

KeepAlive On

MaxKeepAliveRequests 100

KeepAliveTimeout 5

User ${APACHE_RUN_USER}
Group ${APACHE_RUN_GROUP}

HostnameLookups Off

ErrorLog ${APACHE_LOG_DIR}/error.log

LogLevel warn

IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf

LoadModule mpm_event_module /usr/local/apache2/modules/mod_mpm_event.so

<Directory />
        Options FollowSymLinks
        AllowOverride None
        Require all denied
</Directory>
<Directory /usr/share>
        AllowOverride None
        Require all granted
</Directory>
<Directory />
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
</Directory>

<FilesMatch "^\.ht">
        Require all denied
</FilesMatch>

LogFormat "%v:%p %h %l %u %t \"%r\" %>s %B \"%{Referer}i\" \"%{User-Agent}i\"" vhost_combined
LogFormat "%h %l %u %t \"%r\" %>s %B \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%h %l %u %t \"%r\" %>s %B" common
LogFormat "%{Referer}i -> %U" referer
LogFormat "%{User-agent}i" agent

IncludeOptional conf-enabled/*.conf

IncludeOptional sites-enabled/*.conf

Listen 80
Listen 443



<VirtualHost *:80>
    ServerName honestups.com
    ServerAlias www.honestups.com
    Redirect permanent / https://honestups.com/
</VirtualHost>
<VirtualHost *:444>
    ServerName honestups.com
    ServerAlias www.honestups.com
    DocumentRoot /usr/local/apache2/htdocs/
    SSLEngine on
    SSLCertificateFile /usr/local/apache2/htdocs/certs/live/honestups.com/fullchain.pem
    SSLCertificateKeyFile /usr/local/apache2/htdocs/certs/live/honestups.com/privkey.pem

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    # Proxy for node shopping server on port 4001
    ProxyPass "/shop" "https://honestups.com:4006/"
    ProxyPassReverse "/shop" "https://honestups.com:4006/"
    # Proxy for python message-mailing server on port 4002
    ProxyPass "/formem" "https://honestups.com:4007/"
    ProxyPassReverse "/formem" "https://honestups.com:4007/"
    # Proxy for python message-database server on port 4003
    ProxyPass "/formdb" "https://honestups.com:4008/"
    ProxyPassReverse "/formdb" "https://honestups.com:4008/"
    # Proxy for python order-email server on port 4004
    ProxyPass "/orderem" "https://honestups.com:4009/"
    ProxyPassReverse "/orderem" "https://honestups.com:4009/"
    # Proxy for python order-contents database server on port 4005
    ProxyPass "/orderdb" "https://honestups.com:4010/"
    ProxyPassReverse "/orderdb" "https://honestups.com:4010/"
    <Location /general>
        ProxyPassReverse /
        Order allow,deny
        Allow from all
    </Location>
    ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
<Directory "/usr/lib/cgi-bin">
    AllowOverride None
    Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
    Require all granted
</Directory>
</VirtualHost>




