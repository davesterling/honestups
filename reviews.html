  <body>
    <div id="site-content">
      <header>
        <div id="logo">
          <img
            src="media/Insoles/BB-Logo.png"
            alt="Logo"
            onclick="toggleSiteHeader()"
          />
          <div class="relative">
            <a href="javascript:void(0);" onclick="redirect()">Boot Blazers</a>
            <div class="speech up title-attached">back to home</div>
          </div>
          <i class="bx bx-shopping-bag" id="cart-icon" data-quantity="0"></i>
        </div>
        <span class="close-button" onclick="closeSiteHeader()">X</span>
        <nav id="main-nav">
          <a href="about.html">About</a>
          <a href="reviews.html">Reviews</a>
          <a href="faq.html">FAQs</a>
          <a href="contact.html">Contact</a>
        </nav>
      </header>
      <div id="site-header">
        <div style="margin-top: 20vh">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="reviews.html">Reviews</a>
          <a href="faq.html">FAQs</a>
          <a href="contact.html">Contact</a>
        </div>

        <div class="widget-container">
          <div class="widget-toggle"></div>
          <div class="social">
            <a href="#" class="button-link facebook">facebook</a>
            <a href="#" class="button-link instagram">instagram</a>
            <a href="#" class="button-link linkedin">linkedin</a>

            <!-- <a href="#" class="button-link twitter">twitter</a>-->
          </div>
        </div>
      </div>
      <div>
        <video
          autoplay
          muted
          loop
          preload="auto"
          id="video-element"
          poster="media/Insoles/BB-HEADER-02.png"
          playsinline
          data-wf-ignore="true"
          style="pointer-events: none"
        >
          <source src="#" type="video/mp4" />
          <button id="play-button">&#9654;</button>
        </video>

        <div id="comment-slider"></div>

        <div
          style="font-size: 7vh; margin-top: 5vh; color: #fff"
          id="total"
        ></div>
        <div
          style="
            font-size: 3.5vh;
            margin-top: 1vh;
            color: #fff;
            margin-bottom: 40px;
          "
        >
          Write a review today!
        </div>

        <div class="chart-container">
          <div class="bar" id="bar1">
            <div class="value-label" id="label1"></div>
            <div class="stars" id="stars1">★</div>
          </div>
          <div class="bar" id="bar2">
            <div class="value-label" id="label2"></div>
            <div class="stars" id="stars1">★★</div>
          </div>
          <div class="bar" id="bar3">
            <div class="value-label" id="label3"></div>
            <div class="stars" id="stars1">★★★</div>
          </div>
          <div class="bar" id="bar4">
            <div class="value-label" id="label4"></div>
            <div class="stars" id="stars1">★★★★</div>
          </div>
          <div class="bar" id="bar5">
            <div class="value-label" id="label5"></div>
            <div class="stars" id="stars1">★★★★★</div>
          </div>
        </div>
        <div class="review-container">
          <div class="rating">
            <input type="radio" name="rating" id="rating-5" value="5" />
            <label for="rating-5">★</label>
            <input type="radio" name="rating" id="rating-4" value="4" />
            <label for="rating-4">★</label>
            <input type="radio" name="rating" id="rating-3" value="3" />
            <label for="rating-3">★</label>
            <input type="radio" name="rating" id="rating-2" value="2" />
            <label for="rating-2">★</label>
            <input type="radio" name="rating" id="rating-1" value="1" />
            <label for="rating-1">★</label>
          </div>
          <div id="userInfo">
            <label for="userName">Name:</label>
            <input type="text" id="userName" required />
            <label for="productDropdown">Product:</label>
            <select id="productDropdown" required>
              <option value="Boot Blazers">Boot Blazers</option>
              <option value="Variety Pack">Variety Pack</option>
              <option value="Mega Box">Mega Box</option>
            </select>
            <label for="reviewInput">Review:</label>
            <textarea id="reviewInput" rows="4" required></textarea>
          </div>
          <button id="submitBtn" onclick="submitRating();">Submit Rating</button>

        </div>
      </div>
      <div id="reviewBoxes" class="review-dropdown"></div>
      <div id="viewMore" onclick="showMoreReviews()">View More</div>
      <div class="sitemap">
        <a href="reviews.html">Reviews</a>
        <a href="about.html">About Us</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="contact.html">Contact Us</a>
        <a href="faq.html">FAQs</a>
        <a href="privacy.html">Terms of Use</a>

          <a href="testimonials">Testimonials</a>
          <a href="training.html">Training</a>
          <a href="login.html">Login</a>-->
      </div>
    </div>

    <!--Html References for Common blocks-->
    <script>
      fetch("comment-slider.html")
        .then((response) => response.text())
        .then((content) => {
          document.getElementById("comment-slider").innerHTML = content;
        });
    </script>
